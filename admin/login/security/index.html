<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segurança | Marcela Tupinambá</title><link rel="stylesheet" href="/login/access.css"><script src="/js/config.js"></script></head><body><main class="access-main"><section class="access-card"><a href="/admin/">← Voltar ao painel</a><h1>Segurança da conta</h1><p>Proteja seu acesso com um aplicativo autenticador. Guarde acesso ao aplicativo: ele será necessário nos próximos logins.</p><p id="status" role="status">Verificando proteção…</p><button id="enroll" class="primary" hidden>Ativar autenticação em dois fatores</button><form id="verify" hidden><p>Leia o QR no seu aplicativo autenticador.</p><img id="qr" class="mfa-qr" alt="QR para cadastrar o autenticador"><label for="code">Código de seis dígitos</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button class="primary" type="submit">Confirmar ativação</button></form><p id="error" class="access-error" role="alert"></p></section></main><script type="module" src="./security.js"></script></body></html>
